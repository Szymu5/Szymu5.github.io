<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Smile Studio - No Scroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #020617;
            --accent-cyan: #22d3ee;
            --accent-fuchsia: #d946ef;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            margin: 0;
            position: fixed;
            width: 100%;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark));
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            box-sizing: border-box;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 0;
        }

        @media (min-width: 1024px) {
            .workspace { flex-direction: row; }
            .main-container { padding: 1rem; }
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 0;
        }

        .media-box {
            position: relative;
            flex: 1;
            background: black;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .scanning-line {
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan);
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            animation: scan 3s ease-in-out infinite;
        }

        @keyframes scan {
            0%, 100% { top: 0; opacity: 0.1; }
            50% { top: 100%; opacity: 1; }
        }

        .status-bar {
            height: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        .btn {
            height: 3rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-primary { background: #0891b2; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-action { background: #c026d3; }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f59e0b;
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="text-center py-2 shrink-0">
            <h1 class="text-xl md:text-2xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-fuchsia-500 uppercase">
                Studio Karykatury AI
            </h1>
        </header>

        <main class="workspace">
            <!-- Panel Lewy: Kamera -->
            <section class="panel">
                <div class="media-box">
                    <div id="scanIndicator" class="hidden scanning-line"></div>
                    <video id="video" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                    <canvas id="captureCanvas" class="hidden"></canvas>
                    
                    <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90">
                        <p class="text-white/40 text-[10px] font-bold uppercase tracking-widest text-center px-4">
                            Zezwól na dostęp do kamery
                        </p>
                    </div>
                </div>

                <div class="status-bar">
                    <p id="statusText">System gotowy</p>
                </div>
                
                <button id="startBtn" class="btn btn-primary w-full">Start Detekcji</button>
            </section>

            <!-- Panel Prawy: Wynik -->
            <section class="panel">
                <div class="media-box bg-slate-900/30 border-dashed">
                    <div id="placeholderUI" class="text-center opacity-10 font-black text-3xl uppercase tracking-tighter">AI ART</div>
                    <img id="finalImage" class="hidden w-full h-full object-contain z-10" alt="Wynik">
                    
                    <div id="loaderOverlay" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center backdrop-blur-xl z-20">
                        <div class="loader mb-3"></div>
                        <p id="loaderText" class="text-amber-400 font-bold text-[10px] uppercase tracking-widest animate-pulse">Przetwarzanie...</p>
                    </div>
                </div>

                <div id="actionContainer" class="hidden flex gap-2 shrink-0">
                    <button id="resetBtn" class="btn bg-white/5 border border-white/10 flex-1">Nowe</button>
                    <button id="saveBtn" class="btn btn-action flex-1">Zapisz</button>
                </div>
            </section>
        </main>

        <footer class="shrink-0 text-[9px] text-white/20 py-2 flex justify-between items-center px-2">
            <span>PUBLIC API VERSION (1.5 FLASH)</span>
            <span id="apiKeyWarning" class="text-red-500 hidden font-bold">SPRAWDŹ KLUCZ API!</span>
        </footer>
    </div>

    <script>
        /**
         * TWOJE API: Wklej klucz poniżej.
         */
        const apiKey = ""; 
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('captureCanvas');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const finalImage = document.getElementById('finalImage');
        const placeholderUI = document.getElementById('placeholderUI');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const actionContainer = document.getElementById('actionContainer');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const scanIndicator = document.getElementById('scanIndicator');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');

        // Automatyczne sprawdzenie klucza
        if (apiKey === "" && !window.location.hostname.includes('gemini')) {
            document.getElementById('apiKeyWarning').classList.remove('hidden');
        }

        async function apiRequest(model, payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "API Error");
                }
                return await response.json();
            } catch (e) {
                console.error("API Call failed:", e.message);
                throw e;
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: 1280, height: 720 } 
                });
                video.srcObject = stream;
                video.onplaying = () => {
                    cameraPlaceholder.classList.add('hidden');
                    scanIndicator.classList.remove('hidden');
                    startBtn.classList.add('hidden');
                    statusText.textContent = "Skanowanie uśmiechu...";
                    startDetection();
                };
            } catch (e) {
                statusText.textContent = "Brak dostępu do kamery.";
            }
        }

        function startDetection() {
            if (detectionInterval) clearInterval(detectionInterval);
            detectionInterval = setInterval(async () => {
                if (isProcessing) return;
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0);
                const base64 = canvas.toDataURL('image/png').split(',')[1];

                try {
                    // Używamy 1.5-flash (najbardziej stabilny publicznie)
                    const res = await apiRequest('gemini-1.5-flash', {
                        contents: [{
                            parts: [
                                { text: "Is person smiling? Respond JSON: { \"smiling\": true/false, \"msg\": \"Feedback\" }" },
                                { inlineData: { mimeType: "image/png", data: base64 } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    });
                    
                    const data = JSON.parse(res.candidates[0].content.parts[0].text);
                    if (data.smiling) {
                        isProcessing = true;
                        clearInterval(detectionInterval);
                        statusText.textContent = "UŚMIECH WYKRYTY!";
                        generateArt(base64);
                    } else {
                        statusText.textContent = data.msg || "Czekam na uśmiech...";
                    }
                } catch (e) {
                    console.log("Detection skip...");
                }
            }, 3000);
        }

        async function generateArt(base64) {
            loaderOverlay.classList.remove('hidden');
            placeholderUI.classList.add('hidden');
            finalImage.src = `data:image/png;base64,${base64}`;
            finalImage.classList.remove('hidden');

            try {
                // Próba generowania obrazu (wymaga Vertex AI lub konkretnego klucza z dostępem do Imagen)
                // Na standardowym kluczu API Studio, 1.5-flash NIE generuje obrazów.
                // Jeśli Twój klucz nie obsługuje Imagen, aplikacja wyświetli oryginalne zdjęcie jako 'szkic'.
                
                const response = await apiRequest('gemini-1.5-flash', {
                    contents: [{
                        parts: [
                            { text: "Create a funny 3D caricature of this person. Pixar style." },
                            { inlineData: { mimeType: "image/png", data: base64 } }
                        ]
                    }],
                    // Próba wymuszenia modalności obrazu (działa tylko w środowiskach wspierających)
                    generationConfig: { responseModalities: ["IMAGE"] }
                });

                const imagePart = response.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                if (imagePart) {
                    finalImage.src = `data:image/png;base64,${imagePart.inlineData.data}`;
                } else {
                    statusText.textContent = "Twoje zdjęcie (klucz nie wspiera generowania obrazów)";
                }
            } catch (err) {
                console.warn("Image gen failed - showing original as fallback");
                statusText.textContent = "Klucz API ogranicza generowanie grafiki.";
            } finally {
                loaderOverlay.classList.add('hidden');
                actionContainer.classList.remove('hidden');
            }
        }

        function reset() {
            isProcessing = false;
            finalImage.classList.add('hidden');
            placeholderUI.classList.remove('hidden');
            actionContainer.classList.add('hidden');
            scanIndicator.classList.remove('hidden');
            statusText.textContent = "Ponowne skanowanie...";
            startDetection();
        }

        resetBtn.onclick = reset;
        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = finalImage.src;
            link.download = `smile-ai.png`;
            link.click();
        };
        startBtn.onclick = initCamera;
    </script>
</body>
</html>
