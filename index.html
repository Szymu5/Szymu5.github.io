<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smile & Caricature Studio - One Screen Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .loader {
            border-top-color: #f59e0b;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .scanning-line {
            height: 3px;
            background: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 20px #22d3ee;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 20;
            animation: scan 2.5s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 0; opacity: 0.2; }
            50% { top: 100%; opacity: 1; }
        }
        /* Zapobieganie scrollowaniu */
        body, html {
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="gradient-bg text-white font-sans">

    <div class="h-screen w-full flex flex-col p-2 md:p-4 gap-2">
        <!-- Kompaktowy Nagłówek -->
        <header class="text-center shrink-0">
            <h1 class="text-2xl md:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-400 to-fuchsia-500">
                Studio Karykatury AI 🤖
            </h1>
            <p class="text-gray-400 text-xs md:text-sm uppercase tracking-widest">Auto-Detekcja Uśmiechu</p>
        </header>

        <!-- Główny Grid - zajmuje resztę miejsca -->
        <main class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-2 gap-4 p-2">
            
            <!-- Sekcja Kamery -->
            <div class="flex flex-col gap-2 h-full min-h-0">
                <div id="videoContainer" class="relative flex-1 min-h-0 bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
                    <div id="scanIndicator" class="hidden absolute inset-0 pointer-events-none">
                        <div class="scanning-line"></div>
                    </div>
                    
                    <video id="video" autoplay playsinline class="w-full h-full object-cover scale-x-[-1] z-10 relative"></video>
                    <canvas id="captureCanvas" class="hidden"></canvas>
                    
                    <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-0">
                        <svg class="w-12 h-12 text-white/10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-white/20 text-xs">Gotowy do startu</p>
                    </div>
                </div>

                <div id="statusContainer" class="h-16 shrink-0 rounded-xl bg-white/5 border border-white/10 text-center flex flex-col items-center justify-center px-4">
                    <p id="statusText" class="text-gray-300 text-xs md:text-sm font-medium italic">Kliknij start, aby udostępnić kamerę.</p>
                </div>
                
                <button id="startBtn" class="shrink-0 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 py-3 rounded-xl font-bold text-sm transition-all transform active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-cyan-900/20">
                    Uruchom Kamerę
                </button>
            </div>

            <!-- Sekcja Wyniku -->
            <div class="flex flex-col gap-2 h-full min-h-0">
                <div id="resultBox" class="relative flex-1 min-h-0 bg-black/40 rounded-2xl border border-dashed border-white/10 flex items-center justify-center overflow-hidden shadow-2xl">
                    <div id="placeholderUI" class="text-center px-6">
                        <p class="text-white/10 font-bold text-lg uppercase tracking-tighter">Tu pojawi się Twoja postać</p>
                    </div>
                    
                    <img id="finalImage" class="hidden w-full h-full object-contain z-10" alt="Wynik AI">
                    
                    <div id="loaderOverlay" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center backdrop-blur-md z-20">
                        <div class="loader ease-linear rounded-full border-4 border-white/10 h-12 w-12 mb-4"></div>
                        <p class="text-amber-400 font-bold tracking-widest animate-pulse text-xs uppercase">AI rysuje...</p>
                    </div>
                </div>

                <div id="actionContainer" class="hidden h-16 shrink-0 grid grid-cols-2 gap-2">
                    <button id="resetBtn" class="bg-white/5 hover:bg-white/10 rounded-xl font-bold text-sm transition-all border border-white/10">Nowe</button>
                    <button id="saveBtn" class="bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 rounded-xl font-bold text-sm transition-all shadow-lg">Zapisz</button>
                </div>
            </div>
        </main>

        <footer class="text-center text-gray-500 text-[10px] shrink-0 pb-1">
            Gemini 2.5 Flash &bull; Tryb Full Screen
        </footer>
    </div>

    <script>
        const apiKey = ""; 
        const video = document.getElementById('video');
        const canvas = document.getElementById('captureCanvas');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const finalImage = document.getElementById('finalImage');
        const placeholderUI = document.getElementById('placeholderUI');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const actionContainer = document.getElementById('actionContainer');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const scanIndicator = document.getElementById('scanIndicator');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');

        let isProcessing = false;
        let detectionInterval = null;

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
                await new Promise(res => setTimeout(res, delays[i]));
            }
            throw new Error("Failed");
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.onplaying = () => {
                    cameraPlaceholder.classList.add('hidden');
                    scanIndicator.classList.remove('hidden');
                    startBtn.classList.add('hidden');
                    statusText.innerHTML = '<span class="text-cyan-400 font-bold animate-pulse text-sm">SYSTEM GOTOWY</span><br>Uśmiechnij się!';
                    startAutoDetection();
                };
            } catch (err) {
                statusText.innerHTML = '<span class="text-red-400">Brak dostępu do kamery.</span>';
            }
        }

        function startAutoDetection() {
            if (detectionInterval) clearInterval(detectionInterval);
            detectionInterval = setInterval(checkSmile, 3500);
        }

        function captureFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png');
        }

        async function checkSmile() {
            if (isProcessing) return;
            const base64Data = captureFrame().split(',')[1];
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Is the person smiling? Respond ONLY JSON: { \"smiling\": true/false, \"msg\": \"Polish feedback\" }" },
                                { inlineData: { mimeType: "image/png", data: base64Data } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const analysis = JSON.parse(result.candidates[0].content.parts[0].text);
                if (analysis.smiling) {
                    processCaricature(base64Data);
                } else if (analysis.msg) {
                    statusText.textContent = analysis.msg;
                }
            } catch (e) {}
        }

        async function processCaricature(base64Data) {
            isProcessing = true;
            clearInterval(detectionInterval);
            statusText.innerHTML = '<span class="text-green-400 font-bold">MAMY TO! 📸</span>';
            scanIndicator.classList.add('hidden');
            placeholderUI.classList.add('hidden');
            finalImage.src = `data:image/png;base64,${base64Data}`;
            finalImage.classList.remove('hidden');
            loaderOverlay.classList.remove('hidden');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Create a funny Pixar 3D caricature of this person. Big head, huge joyful smile, vibrant colors." }, { inlineData: { mimeType: "image/png", data: base64Data } }]
                        }],
                        generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                    })
                });

                const imagePart = response.candidates[0].content.parts.find(p => p.inlineData);
                if (imagePart) {
                    finalImage.src = `data:image/png;base64,${imagePart.inlineData.data}`;
                    statusText.textContent = "Gotowe!";
                    actionContainer.classList.remove('hidden');
                }
            } catch (err) {
                statusText.textContent = "Błąd. Spróbuj ponownie.";
                setTimeout(resetToScanning, 3000);
            } finally {
                loaderOverlay.classList.add('hidden');
            }
        }

        function resetToScanning() {
            isProcessing = false;
            finalImage.classList.add('hidden');
            placeholderUI.classList.remove('hidden');
            actionContainer.classList.add('hidden');
            scanIndicator.classList.remove('hidden');
            statusText.innerHTML = '<span class="text-cyan-400">Skanowanie...</span>';
            startAutoDetection();
        }

        resetBtn.onclick = resetToScanning;
        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = finalImage.src;
            link.download = `karykatura.png`;
            link.click();
        };
        startBtn.onclick = initCamera;
    </script>
</body>
</html>
