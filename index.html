<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smile & Caricature Studio - One Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #020617 0%, #1e1b4b 100%);
        }
        .loader {
            border-top-color: #f59e0b;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .scanning-line {
            height: 2px;
            background: #22d3ee;
            box-shadow: 0 0 15px #22d3ee;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 0; opacity: 0.3; }
            50% { top: 100%; opacity: 1; }
        }
        body, html {
            height: 100%;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body class="gradient-bg text-white font-sans">

    <div class="h-screen flex flex-col p-3 md:p-6 gap-3">
        <!-- Nagłówek -->
        <header class="text-center shrink-0">
            <h1 class="text-xl md:text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">
                STUDIO KARYKATURY AI 🤖
            </h1>
        </header>

        <!-- Główna sekcja -->
        <main class="flex-1 min-h-0 flex flex-col lg:flex-row gap-4">
            
            <!-- Lewa strona: Kamera -->
            <div class="flex-1 flex flex-col gap-3 min-h-0">
                <div id="videoContainer" class="relative flex-1 bg-black rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                    <div id="scanIndicator" class="hidden absolute inset-0 pointer-events-none">
                        <div class="scanning-line"></div>
                    </div>
                    
                    <video id="video" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                    <canvas id="captureCanvas" class="hidden"></canvas>
                    
                    <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/50 backdrop-blur-sm">
                        <svg class="w-12 h-12 text-white/20 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-white/30 text-xs font-bold uppercase tracking-widest">Kamera gotowa</p>
                    </div>
                </div>

                <div class="h-14 shrink-0 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center px-4 overflow-hidden">
                    <p id="statusText" class="text-gray-400 text-xs md:text-sm text-center font-medium leading-tight italic">
                        Kliknij przycisk poniżej, aby uruchomić AI.
                    </p>
                </div>
                
                <button id="startBtn" class="shrink-0 bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-bold text-sm transition-all transform active:scale-95 shadow-xl flex items-center justify-center gap-2">
                    URUCHOM DETEKCJĘ
                </button>
            </div>

            <!-- Prawa strona: Wynik -->
            <div class="flex-1 flex flex-col gap-3 min-h-0">
                <div id="resultBox" class="relative flex-1 bg-slate-900/30 rounded-3xl border border-dashed border-white/20 flex items-center justify-center overflow-hidden">
                    <div id="placeholderUI" class="text-center opacity-20">
                        <p class="font-black text-3xl md:text-5xl tracking-tighter">AI ART</p>
                        <p class="text-[10px] uppercase tracking-[0.3em]">Czekam na Twój uśmiech</p>
                    </div>
                    
                    <img id="finalImage" class="hidden w-full h-full object-contain" alt="Wynik">
                    
                    <div id="loaderOverlay" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center backdrop-blur-xl z-20">
                        <div class="loader rounded-full border-4 border-white/5 h-12 w-12 mb-4"></div>
                        <p class="text-amber-400 font-black text-[10px] uppercase tracking-widest animate-pulse">Generowanie karykatury...</p>
                    </div>
                </div>

                <div id="actionContainer" class="hidden h-14 shrink-0 flex gap-3">
                    <button id="resetBtn" class="flex-1 bg-white/5 hover:bg-white/10 rounded-2xl font-bold text-xs uppercase tracking-widest transition-all border border-white/10">Nowe</button>
                    <button id="saveBtn" class="flex-1 bg-fuchsia-600 hover:bg-fuchsia-500 rounded-2xl font-bold text-xs uppercase tracking-widest transition-all shadow-lg">Zapisz</button>
                </div>
            </div>
        </main>

        <footer class="shrink-0 text-center text-[10px] text-white/20 pb-1">
            POWERED BY GEMINI 2.5 FLASH • WSZYSTKIE PRAWA ZASTRZEŻONE
        </footer>
    </div>

    <script>
        // API KEY: In the preview environment, this will be handled automatically.
        const apiKey = "AIzaSyBdEZ-ptyF1CIrg2LT7QeDDziuuAKxbfOc"; 
        const video = document.getElementById('video');
        const canvas = document.getElementById('captureCanvas');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const finalImage = document.getElementById('finalImage');
        const placeholderUI = document.getElementById('placeholderUI');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const actionContainer = document.getElementById('actionContainer');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const scanIndicator = document.getElementById('scanIndicator');
        const cameraPlaceholder = document.getElementById('cameraPlaceholder');

        let isProcessing = false;
        let detectionInterval = null;

        // Unified fetch function with retry and 404 protection
        async function callGemini(model, payload) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000];
            
            for (let i = 0; i < delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.status === 404) {
                        // If model not found, try a standard fallback model
                        if (model.includes('2.5')) return callGemini('gemini-1.5-flash', payload);
                        throw new Error("Model nieodnaleziony (404)");
                    }
                    
                    if (response.ok) return await response.json();
                } catch (e) {
                    if (i === delays.length - 1) throw e;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
            throw new Error("Błąd komunikacji z AI");
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.onplaying = () => {
                    cameraPlaceholder.classList.add('hidden');
                    scanIndicator.classList.remove('hidden');
                    startBtn.classList.add('hidden');
                    statusText.innerHTML = '<span class="text-cyan-400 font-black animate-pulse">Skanowanie...</span><br>Uśmiechnij się szeroko!';
                    startAutoDetection();
                };
            } catch (err) {
                statusText.innerHTML = '<span class="text-red-400">Brak dostępu do kamery.</span>';
                console.error(err);
            }
        }

        function startAutoDetection() {
            if (detectionInterval) clearInterval(detectionInterval);
            detectionInterval = setInterval(checkSmile, 3000);
        }

        function captureFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png').split(',')[1];
        }

        async function checkSmile() {
            if (isProcessing) return;
            const base64Data = captureFrame();
            
            try {
                // Use 2.5-flash-preview as instructed, with 1.5-flash fallback in callGemini
                const result = await callGemini('gemini-2.5-flash-preview-09-2025', {
                    contents: [{
                        role: "user",
                        parts: [
                            { text: "Analyze image. Is person smiling clearly? Response JSON: { \"smiling\": true/false, \"msg\": \"Short Polish advice\" }" },
                            { inlineData: { mimeType: "image/png", data: base64Data } }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                });

                const analysis = JSON.parse(result.candidates[0].content.parts[0].text);
                if (analysis.smiling) {
                    processCaricature(base64Data);
                } else if (analysis.msg) {
                    statusText.textContent = analysis.msg;
                }
            } catch (e) {
                console.warn("API Error:", e.message);
            }
        }

        async function processCaricature(base64Data) {
            isProcessing = true;
            clearInterval(detectionInterval);
            statusText.innerHTML = '<span class="text-green-400 font-black">UCHWYCONO UŚMIECH! 📸</span>';
            scanIndicator.classList.add('hidden');
            
            placeholderUI.classList.add('hidden');
            finalImage.src = `data:image/png;base64,${base64Data}`;
            finalImage.classList.remove('hidden');
            loaderOverlay.classList.remove('hidden');

            try {
                const response = await callGemini('gemini-2.5-flash-image-preview', {
                    contents: [{
                        parts: [
                            { text: "Create a funny 3D caricature of this person. Pixar style. Big head, huge joyful smile, vibrant background. High quality digital art." },
                            { inlineData: { mimeType: "image/png", data: base64Data } }
                        ]
                    }],
                    generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                });

                const imagePart = response.candidates[0].content.parts.find(p => p.inlineData);
                if (imagePart) {
                    finalImage.src = `data:image/png;base64,${imagePart.inlineData.data}`;
                    statusText.textContent = "Twoja postać jest gotowa!";
                    actionContainer.classList.remove('hidden');
                }
            } catch (err) {
                statusText.textContent = "Błąd generowania. Spróbuj ponownie.";
                setTimeout(resetToScanning, 3000);
            } finally {
                loaderOverlay.classList.add('hidden');
            }
        }

        function resetToScanning() {
            isProcessing = false;
            finalImage.classList.add('hidden');
            placeholderUI.classList.remove('hidden');
            actionContainer.classList.add('hidden');
            scanIndicator.classList.remove('hidden');
            statusText.innerHTML = '<span class="text-cyan-400 font-bold">Tryb detekcji...</span>';
            startAutoDetection();
        }

        resetBtn.onclick = resetToScanning;
        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = finalImage.src;
            link.download = `karykatura-ai-${Date.now()}.png`;
            link.click();
        };
        startBtn.onclick = initCamera;
    </script>
</body>
</html>
