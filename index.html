<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smile & Caricature Studio - Debug Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .loader {
            border-top-color: #fbbf24;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .scan-line {
            height: 2px;
            background: rgba(34, 211, 238, 0.8);
            box-shadow: 0 0 15px #22d3ee;
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 2.5s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white flex flex-col items-center p-4 md:p-8 font-sans">

    <div class="max-w-5xl w-full bg-white/5 backdrop-blur-xl rounded-3xl p-6 md:p-10 shadow-2xl border border-white/10">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                AI Smile Studio 📸
            </h1>
            <p class="text-gray-400">Automatyczna analiza uśmiechu i generowanie karykatur</p>
        </header>

        <!-- Panel diagnostyczny (widoczny tylko przy błędach) -->
        <div id="errorPanel" class="hidden mb-6 p-4 bg-red-900/50 border border-red-500/50 rounded-2xl text-red-200 text-sm">
            <p class="font-bold mb-1">Wykryto problem:</p>
            <p id="errorDetail"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Kamera -->
            <div class="space-y-4">
                <div class="relative group">
                    <div id="scanIndicator" class="hidden absolute inset-0 z-10 pointer-events-none overflow-hidden rounded-2xl">
                        <div class="scan-line"></div>
                    </div>
                    <div class="relative bg-black rounded-2xl overflow-hidden aspect-video flex items-center justify-center border-2 border-white/10">
                        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                        <canvas id="captureCanvas" class="hidden"></canvas>
                    </div>
                </div>
                <div id="statusMessage" class="p-4 rounded-xl bg-white/5 border border-white/10 text-center font-medium min-h-[70px] flex items-center justify-center text-sm">
                    Gotowy do pracy. Kliknij przycisk poniżej.
                </div>
            </div>

            <!-- Wynik -->
            <div class="space-y-4">
                <div id="resultContainer" class="relative bg-black/40 rounded-2xl aspect-video flex items-center justify-center border-2 border-dashed border-white/10 overflow-hidden group">
                    <span id="placeholderText" class="text-white/20 text-center px-6">Tutaj pojawi się Twoja karykatura, gdy tylko się uśmiechniesz</span>
                    <img id="displayImage" class="hidden w-full h-full object-contain" alt="Podgląd">
                    
                    <div id="loaderOverlay" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center backdrop-blur-md">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-white/10 h-12 w-12 mb-4"></div>
                        <p class="text-amber-400 font-bold animate-pulse text-xs tracking-tighter">AI RYSUJE KARYKATURĘ...</p>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="startCamBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition-all shadow-lg text-lg">
                        Uruchom Auto-Detekcję
                    </button>
                    
                    <div id="actionButtons" class="hidden flex gap-3">
                        <button id="resetBtn" class="flex-1 bg-white/10 hover:bg-white/20 py-4 rounded-2xl font-bold transition-all border border-white/10">
                            Nowe zdjęcie
                        </button>
                        <button id="saveBtn" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 py-4 rounded-2xl font-bold transition-all shadow-lg">
                            Zapisz plik
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-10 pt-6 border-t border-white/5 text-center text-[10px] text-gray-500">
            Wymaga własnego klucza API z Google AI Studio (zmienna 'apiKey' w kodzie).
        </footer>
    </div>

    <script>
        // --- KONFIGURACJA ---
        // WKLEJ SWÓJ KLUCZ PONIŻEJ
        const apiKey = "AIzaSyA0rWTTqVMQ-Z1P-a1KKkdRoeWWgAFkbaw"; 
        // --------------------

        const video = document.getElementById('video');
        const canvas = document.getElementById('captureCanvas');
        const startBtn = document.getElementById('startCamBtn');
        const statusMsg = document.getElementById('statusMessage');
        const displayImage = document.getElementById('displayImage');
        const placeholder = document.getElementById('placeholderText');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const actionButtons = document.getElementById('actionButtons');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const scanIndicator = document.getElementById('scanIndicator');
        const errorPanel = document.getElementById('errorPanel');
        const errorDetail = document.getElementById('errorDetail');

        let isProcessing = false;
        let detectionInterval = null;

        function showError(msg) {
            errorPanel.classList.remove('hidden');
            errorDetail.textContent = msg;
        }

        async function initCamera() {
            if (!apiKey) {
                showError("Brak klucza API! Otwórz plik w notatniku i wklej klucz w zmiennej 'apiKey'.");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                await video.play();
                
                startBtn.classList.add('hidden');
                scanIndicator.classList.remove('hidden');
                statusMsg.innerHTML = '<span class="text-cyan-400">System aktywny. Uśmiechnij się do kamery!</span>';
                
                startAutoDetection();
            } catch (err) {
                showError("Nie można uruchomić kamery. Upewnij się, że strona używa HTTPS i nadałeś uprawnienia. Błąd: " + err.message);
            }
        }

        function startAutoDetection() {
            if (detectionInterval) clearInterval(detectionInterval);
            detectionInterval = setInterval(checkSmile, 4000);
        }

        async function callGemini(payload, model = "gemini-2.5-flash-preview-09-2025") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }
                
                return await response.json();
            } catch (e) {
                throw e;
            }
        }

        async function checkSmile() {
            if (isProcessing) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const fullDataUrl = canvas.toDataURL('image/png');
            const base64Data = fullDataUrl.split(',')[1];
            
            statusMsg.innerHTML = '<span class="text-gray-400 animate-pulse italic">Analizuję Twój wyraz twarzy...</span>';

            try {
                const result = await callGemini({
                    contents: [{
                        parts: [
                            { text: "Analyze this image. Is the person smiling clearly? Answer ONLY with JSON: { \"smiling\": true/false }. If false, optionally add a short funny Polish 'message' (max 8 words) to encourage a smile." },
                            { inlineData: { mimeType: "image/png", data: base64Data } }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                });

                const content = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!content) throw new Error("AI nie zwróciło odpowiedzi.");
                
                const analysis = JSON.parse(content);

                if (analysis.smiling) {
                    isProcessing = true;
                    clearInterval(detectionInterval);
                    statusMsg.innerHTML = '<span class="text-green-400 font-bold">UŚMIECH WYKRYTY! PRZYGOTUJ SIĘ...</span>';
                    
                    placeholder.classList.add('hidden');
                    displayImage.src = fullDataUrl;
                    displayImage.classList.remove('hidden');
                    loaderOverlay.classList.remove('hidden');
                    scanIndicator.classList.add('hidden');

                    await generateCaricature(base64Data);
                } else {
                    statusMsg.textContent = analysis.message || "Uśmiechnij się szerzej!";
                }
            } catch (err) {
                console.error(err);
                statusMsg.innerHTML = `<span class="text-red-400 italic text-[10px]">Błąd połączenia: ${err.message}</span>`;
            }
        }

        async function generateCaricature(base64Data) {
            try {
                const result = await callGemini({
                    contents: [{
                        parts: [
                            { text: "Create a funny, colorful digital caricature based on this person. Exaggerate features: large head, tiny body, big smile. Keep it recognizable but very humorous." },
                            { inlineData: { mimeType: "image/png", data: base64Data } }
                        ]
                    }],
                    generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                }, "gemini-2.5-flash-image-preview");

                const imagePart = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                
                if (imagePart) {
                    displayImage.src = `data:image/png;base64,${imagePart.inlineData.data}`;
                    statusMsg.innerHTML = '<span class="text-green-400">Twoja karykatura jest gotowa! ✨</span>';
                    actionButtons.classList.remove('hidden');
                } else {
                    throw new Error("Model nie wygenerował obrazu.");
                }
            } catch (err) {
                statusMsg.textContent = "Błąd generowania obrazu: " + err.message;
                resetToScanning();
            } finally {
                loaderOverlay.classList.add('hidden');
            }
        }

        function resetToScanning() {
            isProcessing = false;
            displayImage.classList.add('hidden');
            placeholder.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            scanIndicator.classList.remove('hidden');
            statusMsg.textContent = "Czekam na Twój uśmiech!";
            startAutoDetection();
        }

        resetBtn.onclick = resetToScanning;
        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = displayImage.src;
            link.download = `karykatura-${Date.now()}.png`;
            link.click();
        };
        startBtn.onclick = initCamera;

    </script>
</body>
</html>
